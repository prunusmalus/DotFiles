
# KEYBINDS #
############

$mainMod = SUPER

# Custom Variables
$scriptsDir = $HOME/.config/hypr/scripts
$wallpaper = $scriptsDir/Wallpaper.sh
$wallpaperSelect = $scriptsDir/WallpaperSelect.sh
$power_menu = $scriptsDir/powermenu.sh
$terminal = kitty
$file_man = dolphin
$terminal_file_man = yazi
$rofi-emoji = $scriptsDir/rofi-emoji.sh
$help = $scriptsDir/keybinds.sh
$volumeCTRL = $scriptsDir/volumecontrol.sh
$apps = $scriptsDir/apps.sh

# Change Wallpaper
bind = $mainMod SHIFT ALT, W, exec, $wallpaper
bind = $mainMod ALT, e, exec, $scriptsDir/change_wallpaper_engine.sh
bind = $mainMod SHIFT, W, exec, $wallpaperSelect thm1
bind = $mainMod CTRL SHIFT, W, exec, $wallpaperSelect thm2

# browser
#bind = $mainMod, W, exec, google-chrome-canary
bind = $mainMod, W, exec, zen-browser

# kitty
bind = $mainMod, T, exec, kitty

# Screenshot
bind = ,print, exec, $scriptsDir/screenshot.sh

# Key Binds Help
bind = $mainMod SHIFT, h, exec, $help

bind = $mainMod, Return, exec, $terminal --title main
bind = $mainMod SHIFT, Return, exec, $terminal --title floating
bind = $mainMod, Q, killactive, 
bind = $mainMod SHIFT, M, exit, 
# bind = $mainMod, E, exec, $file_man
bind = $mainMod, E, exec, nautilus
bind = $mainMod SHIFT, E, exec, kitty --title $terminal_file_man -e $terminal_file_man # open yazi
bind = $mainMod, V, togglefloating, 
bind = $mainMod SHIFT ALT, v, exec, hyprctl dispatch workspaceopt allfloat
bind = $mainMod, f, fullscreen,
bind = $mainMod, R, exec, $scriptsDir/menu.sh || pkill rofi
bind = $mainMod ALT SHIFT, D, exec, $scriptsDir/rofi_theme.sh
bind = $mainMod ALT, c, exec, $scriptsDir/cliphist.sh c #clipboard manager
bind = $mainMod ALT, w, exec, $scriptsDir/cliphist.sh w #clipboard wipe
bind = $mainMod ALT, D, exec, $rofi-emoji
bind = $mainMod SHIFT ALT, P, pseudo, # dwindle
#bind = $mainMod, x, exec, $power_menu
bind = $mainMod, X, exec, wlogout -b 6 --layout ~/.config/wlogout/layout --css ~/.config/wlogout/style.css
bind = $mainMod ALT, x, exec, $scriptsDir/powermenu_theme_select.sh
bind = $mainMod, C, exec, $terminal cava
# bind = $mainMod, c, exec, code
# bind = $mainMod, b, exec, $scriptsDir/browser.sh op # open brave or chromium
bind = $mainMod, B, exec, blueman-manager
bind = $ALT, b, exec,$scriptsDir/default_browser.sh --reset # reset default browser
bind = $CONTROL, ESCAPE, exec, $scriptsDir/waybar-reload.sh --reload # reload waybar
bind = $CONTROL ALT, ESCAPE, exec, $scriptsDir/waybar-reload.sh --toggle # hide and start waybar
bind = $mainMod SHIFT, l, exec, hyprlock
bind = $mainMod ALT, l, exec, $scriptsDir/hyprlock.sh
bind = $mainMod ALT, l, exec, $scriptsDir/toggle_dark_light.sh
bind = $mainMod CTRL, w, exec, $scriptsDir/waybar-layout.sh
bind = $mainMod CTRL, e, exec, $scriptsDir/edit-dotfiles.sh
bind = $mainMod ALT, b, exec, $scriptsDir/shell.sh
bind = $mainMod CTRL, R, exec, hyprctl reload && notify-send "Done" "Hyprland reload" # reload hyprland
bind = $mainMod, U, exec, $scriptsDir/systemupdate.sh --update # update system
bind = $mainMod CTRL, U, exec, kitty --title browser sh -c "$scriptsDir/hyprconf-v2.sh" # update hyprconf-v2
bind = $mainMod SHIFT ALT, R, exec, $scriptsDir/startup.sh &> /dev/null # update system
bind = $mainMod SHIFT ALT, s, exec, kitty --title browser sh -c "$scriptsDir/settings.sh"
bind = $mainMod SHIFT, t, exec, $scriptsDir/theme_select.sh
bind = $mainMod ALT, U, exec, kitty sh -c "$scriptsDir/uninstall.sh"

# Yazi
bind = $mainMod, Y, exec, kitty yazi

bind = $mainMod ALT, T, exec, kitty tty-clock -c -s

# Pypr
bind = $mainMod SHIFT ALT, P, exec, pypr

# AyuGram
bind = $mainMod, A, exec, AyuGram

# Viber
bind = $mainMod ALT, V, exec, viber

# Pavucontrol
bind = $mainMod SHIFT, R, exec, pavucontrol

# Spotify
bind = $mainMod, S, exec, flatpak run com.spotify.Client

# Wlogout
bind = $mainMod ALT, R, exec, wlogout -b 6 --layout ~/.config/wlogout/layout --css ~/.config/wlogout/style.css

# Lutris
bind = $mainMod, D, exec, lutris

# Swaync notification center
bind = $mainMod, N, exec, swaync-client -t

# hyprlock
#bind = $mainMod, L, exec, hyprlock
bind = $mainMod, L, exec, blazinlock -s

# Steam
bind = $mainMod ALT, S, exec, steam

# Record
# bind = $mainMod SHIFT, D, exec, $HOME/.config/hypr/scripts/record_region.sh

# !!! УБЕДИТЕСЬ, ЧТО ЭТОТ ПУТЬ ПРАВИЛЬНЫЙ !!!
$scr_menu = /home/prunus/Scripts/capture_menu.sh

# --- Биндинги для Захвата Экрана ---

# 1. ЗАПУСК МЕНЮ: Super+Shift+D
# Запускает скрипт с Rofi
# bind = SUPER SHIFT, D, exec, $scr_menu

# Привязка для запуска/остановки записи области
# Примечание: 'bindl=' позволяет использовать bind, даже когда экран заблокирован (для некоторых)
bindl = $mainMod SHIFT, D, exec, ~/.config/hypr/scripts/record_area.sh

# 2. ОСТАНОВКА ЗАПИСИ: Super+Shift+S (рекомендуемая отдельная комбинация)
# Отправляет сигнал завершения (SIGINT) процессу wf-recorder,
# PID которого сохранен в /tmp/wf-recorder.pid.
# bind = SUPER SHIFT, S, exec, kill -s SIGINT $(cat /tmp/wf-recorder.pid 2>/dev/null) && rm /tmp/wf-recorder.pid && notify-send "Запись Остановлена" "Файл сохранен в ~/Videos/Movies"

# Привязка для скриншота выделенной области
#bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

bind = $mainMod SHIFT, S, exec, sh -c 'FILENAME=$(date +%Y-%m-%d_%H-%M-%S.png); grim -g "$(slurp)" ~/Pictures/Screenshots/$FILENAME && wl-copy < ~/Pictures/Screenshots/$FILENAME'

# Очистить все уведомления swaync по Ctrl + Alt + C
bind = CONTROL ALT, C, exec, swaync-client -C

# re-generate colors if the ~/.cache/wal directory has been deleted
bind = $mainMod CTRL, p, exec, notify-send "Colors" "Re-generating colors." && $scriptsDir/pywal.sh

# Google Docs 
bind = $mainMod SHIFT, G, exec, google-docs

# switch window
bind = $mainMod, Tab, exec, rofi -show window -theme ~/.config/rofi/themes/rofi-window.rasi
# bind = $mainMod, Tab, exec, hyprswitch gui --mod-key super --key tab --max-switch-offset 9 --hide-active-window-border

# Minecraft
#bind = $mainMod, M, exec, $terminal java -jar ~/Minecraft/TLauncher.jar

# Swaync
bind = $mainMod ALT SHIFT, Y, exec, swaync

# Torrent
bind = $mainMod, H, exec, hydralauncher

# Cycle windows if floating bring to top
bind = ALT, tab, cyclenext
bind = ALT, tab, bringactivetotop 
bind = $mainMod, G, togglegroup
bind = $mainMod ALT, M, exec, hyprctl dispatch splitratio 0.3
bind = $mainMod SHIFT, I, togglesplit # only works on dwindle layout
bind = $mainMod SHIFT, P, pseudo, # dwindle


# Audio control
bind = , F9, exec, $volumeCTRL --toggle # toggle audio mute
bind = , F10, exec, $volumeCTRL --dec # decrease volume
bind = , F11, exec, $volumeCTRL --inc # increase volume

# hyprsunset
bind = $mainMod, F1, exec, $scriptsDir/nightlight.sh --dec  # night light
bind = $mainMod, F2, exec, $scriptsDir/nightlight.sh --inc # day light
bind = $mainMod, F3, exec, $scriptsDir/nightlight.sh --def # default value

# brightness
bind = ALT, F4, exec, $scriptsDir/brightness.sh up
bind = ALT, F3, exec, $scriptsDir/brightness.sh down

# brightness control for Laptop Keys
bind = , XF86MonBrightnessUP, exec, $scriptsDir/brightness.sh up
bind = , XF86MonBrightnessDOWN, exec, $scriptsDir/brightness.sh down

# Move focus with mainMod + arrow keys
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r
bind = $mainMod, left, movefocus, l

# Move active window around current workspace with mainMod + SHIFT + CTRL [←→↑↓]
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, left, movewindow, l

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10

# Move window silently to workspace Super + Alt + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# Scroll workspace keys 
# bind = $mainMod SHIFT, up, workspace, e-1 
# bind = $mainMod SHIFT, down, workspace, e+1


bind = $mainMod ALT, up, workspace, e-1 
bind = $mainMod ALT, down, workspace, e+1

# Move to workspace with scroll
bind = $mainMod ALT, mouse_down, movetoworkspace, e-1
bind = $mainMod ALT, mouse_up, movetoworkspace, e+1 

# KEYBINDS
bind = $mainMod SHIFT, K, exec, $terminal nvim ~/.config/hypr/confs/keybinds.conf 

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# pyprland related
#bind = $mainMod SHIFT, A, exec, pypr toggle term                  # toggles the "term" scratchpad visibility
#bind = $mainMod SHIFT, B, exec, pypr expose                 # exposes every window temporarily or "jump" to the fucused one
#bind = $mainMod SHIFT, J, exec, pypr change_workspace -1          # alternative multi-monitor workspace switcher
#bind = $mainMod SHIFT, K, exec, pypr change_workspace +1          # alternative multi-monitor workspace switcher
#bind = $mainMod, N, exec, pypr toggle_special minimized     # toggle a window from/to the "minimized" special workspace
bind = $mainMod SHIFT, N, togglespecialworkspace, minimized   # toggle the "minimized" special workspace visibility
bind = $mainMod SHIFT, O, exec, pypr shift_monitors +1      # swaps workspaces between monitors
bind = $mainMod SHIFT, Z, exec, pypr zoom ++0.5             # zooms in the focused workspace
bind = $mainMod, Z, exec, pypr zoom                         # toggle zooming

# Desktop zooming or magnifier
bind = $mainMod ALT SHIFT, mouse_down, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bind = $mainMod ALT SHIFT, mouse_up, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')" 

# bind = $mainMod, tab, workspace, m+1
# bind = $mainMod SHIFT, tab, workspace, m-1

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Привязка для переключения (Play/Pause) медиа
bindl=, XF86AudioPlay, exec, playerctl play-pause

# Привязка для переключения (Play/Pause) медиа
bindl=$mainMod SHIFT, C, exec, playerctl play-pause

# Следующий трек
bindl=, XF86AudioNext, exec, playerctl next

# Предыдущий трек
bindl=, XF86AudioPrev, exec, playerctl previous

# Следующий трек
bindl=$mainMod SHIFT, V, exec, playerctl next

# Предыдущий трек
bindl=$mainMod SHIFT, X, exec, playerctl previous
