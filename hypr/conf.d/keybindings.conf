# ==================
# KEYBINDINGS
# ==================
$mod = SUPER

# === Application Launchers ===
#bind = $mod, T, exec, /home/prunus/.local/kitty.app/bin/kitty
#bind = $mod, T, exec, ./home/prunus/.local/kitty.app
#bind = $mod, T, exec, kitty zellij
bind = $mod, T, exec, kitty
#bind = $mod, T, exec, kitty tmux
#bind = $mod, R, exec, dms ipc call spotlight toggle
# browser
#bind = $mod, W, exec, google-chrome-canary
bind = $mod, W, exec, firefox

# kitty
#bind = $mod, T, exec, kitty

# Screenshot
#bind = ,print, exec, $scriptsDir/screenshot.sh

# Key Binds Help
bind = $mod ALT, h, exec, $help

bind = $mod, Return, exec, $terminal --title main
bind = $mod SHIFT, Return, exec, $terminal --title floating
#bind = $mod, Q, killactive, 
#bind = $mod SHIFT, M, exit, 
# bind = $mod, E, exec, $file_man
#bind = $mod, E, exec, nautilus
bind = $mod SHIFT, E, exec, kitty --title $terminal_file_man -e $terminal_file_man # open yazi
#bind = $mod, V, togglefloating, 
bind = $mod SHIFT ALT, v, exec, hyprctl dispatch workspaceopt allfloat
#bind = $mod, f, fullscreen,
bind = $mod, R, exec, $scriptsDir/menu.sh || pkill rofi
bind = $mod ALT SHIFT, D, exec, $scriptsDir/rofi_theme.sh
bind = $mod ALT, c, exec, $scriptsDir/cliphist.sh c #clipboard manager
bind = $mod ALT, w, exec, $scriptsDir/cliphist.sh w #clipboard wipe
bind = $mod ALT, D, exec, $rofi-emoji
bind = $mod SHIFT ALT, P, pseudo, # dwindle
#bind = $mod, x, exec, $power_menu
bind = $mod, X, exec, wlogout -b 6 --layout ~/.config/wlogout/layout --css ~/.config/wlogout/style.css
#bind = $mod ALT, x, exec, $scriptsDir/powermenu_theme_select.sh
bind = $mod, C, exec, $terminal cava
#bind = $mod, C, exec, cool-retro-term cava

# bind = $mod, c, exec, code
# bind = $mod, b, exec, $scriptsDir/browser.sh op # open brave or chromium
bind = $mod, B, exec, [float; size 1200 800; center] blueman-manager
bind = $ALT, b, exec,$scriptsDir/default_browser.sh --reset # reset default browser
#bind = $CONTROL, ESCAPE, exec, $scriptsDir/waybar-reload.sh --reload # reload waybar
bind = $mod, ESCAPE, exec, hyprpanel
bind = $CONTROL, ESCAPE, exec, dms run
bind = $CONTROL ALT, ESCAPE, exec, $scriptsDir/waybar-reload.sh --toggle # hide and start waybar
bind = $mod SHIFT, l, exec, hyprlock
#bind = $mod ALT, l, exec, $scriptsDir/hyprlock.sh
bind = $mod ALT, l, exec, $scriptsDir/toggle_dark_light.sh
bind = $mod CTRL, w, exec, $scriptsDir/waybar-layout.s
bind = $mod CTRL, e, exec, $scriptsDir/edit-dotfiles.sh
bind = $mod ALT, b, exec, $scriptsDir/shell.sh
bind = $mod CTRL, R, exec, hyprctl reload && notify-send "Done" "Hyprland reload" # reload hyprland
bind = $mod ALT, U, exec, $scriptsDir/systemupdate.sh --update # update system
bind = $mod CTRL, U, exec, kitty --title browser sh -c "$scriptsDir/hyprconf-v2.sh" # update hyprconf-v2
bind = $mod SHIFT ALT, R, exec, $scriptsDir/startup.sh &> /dev/null # update system
# Old settings
#bind = $mod SHIFT ALT, s, exec, kitty --title browser sh -c "$scriptsDir/settings.sh"
bind = $mod SHIFT, t, exec, $scriptsDir/theme_select.sh
#bind = $mod ALT, U, exec, kitty sh -c "$scriptsDir/uninstall.sh"

# Yazi
bind = $mod, Y, exec, kitty yazi

bind = $mod ALT, T, exec, kitty tty-clock -c -s -C 4

# Pypr
bind = $mod SHIFT ALT, P, exec, pypr

# AyuGram
bind = $mod, A, exec, AyuGram

# Viber
bind = $mod ALT, V, exec, viber

# Pavucontrol
#bind = $mod SHIFT, R, exec, [rules = float, title:^(Volume control)] pavucontrol
bind = SUPER_SHIFT, R, exec, [float; size 1200 800; center] pavucontrol

# Mission center
bind = $mod, M, exec, [float; size 1200 800; center] flatpak run io.missioncenter.MissionCenter

# Spotify
bind = $mod, S, exec, flatpak run com.spotify.Client

# Wlogout
bind = $mod ALT, R, exec, wlogout -b 6 --layout ~/.config/wlogout/layout --css ~/.config/wlogout/style.css

# Lutris
bind = $mod, D, exec, lutris

# Swaync notification center
bind = $mod, N, exec, swaync-client -t

# hyprlock
#bind = $mod, L, exec, hyprlock
#bind = $mod, L, exec, blazinlock -s

# Steam
bind = $mod ALT, S, exec, steam

# TextbookSelect
bind = $mod SHIFT, F, exec, $textbookSelect 

# --- Биндинги для Захвата Экрана ---
bindl = $mod SHIFT, D, exec, ~/.config/hypr/scripts/idk.sh
bindl = $mod CTRL, D, exec, ~/.config/hypr/scripts/test.sh

bind = $mod SHIFT, S, exec, quickshell -c ~/.config/quickshell/hyprquickshot/ -n

# === Security ===
bind = $mod, L, exec, dms ipc call lock lock
#bind = $mod SHIFT, E, exit
bind = CTRL ALT, Delete, exec, dms ipc call processlist toggle

# Nautilus
#bind = $mod, E, exec, nautilus
#bind = $mod, E, exec, dolphin #index
bind = $mod, E, exec, nemo

# Hyprland config
bind = $mod, H, exec, kitty nvim ~/.config/hypr/hyprland.conf

# Gmail
bind = $mod, G, exec, zen-browser https://www.gmail.com

# Swaync
bind = $mod SHIFT ALT, M, exec, swaync

# Clear swaync
bind = CTRL ALT, C, exec, swaync-client -C

# notification
bind = $mod SHIFT, F, exec, dms ipc call notification toggle

# Agenda sime
bind = $mod SHIFT, A, exec, zen-browser https://agenda.sime.md

# Gemini
bind = $mod SHIFT, G, exec, gemini-desktop

# Edex-ui 
bind = $mod ALT SHIFT, E, exec, edex-ui

# Collector
bind = $mod ALT SHIFT, C, exec, flatpak run it.mijorus.collector

# Cycle windows if floating bring to top
bind = ALT, tab, cyclenext
bind = ALT, tab, bringactivetotop 

# Pipes
bind = $mod, P, exec, kitty pipes.sh


# === Audio Controls ===
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bindl = , XF86AudioMicMute, exec, dms ipc call audio micmute
bindel = $mod ALT, Z, exec, dms ipc call audio decrement 2
bindel = $mod ALT, X, exec, dms ipc call audio increment 2

# === Brightness Controls ===
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""
bindel = $mod ALT, N, exec, dms ipc call brightness decrement 2 ""
bindel = $mod ALT, M, exec, dms ipc call brightness increment 2 ""

# === Window Management ===
bind = $mod, Q, killactive
#bind = $mod, F, fullscreen, 1
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating
bind = $mod ALT SHIFT, W, togglegroup

# === Focus Navigation ===
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# === Window Movement ===
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# === Column Navigation ===
bind = $mod, Home, focuswindow, first
bind = $mod, End, focuswindow, last

# === Monitor Navigation ===
bind = $mod CTRL, left, focusmonitor, l
bind = $mod CTRL, right, focusmonitor, r
bind = $mod CTRL, H, focusmonitor, l
bind = $mod CTRL, J, focusmonitor, d
bind = $mod CTRL, K, focusmonitor, u
bind = $mod CTRL, L, focusmonitor, r

# === Move to Monitor ===
bind = $mod SHIFT CTRL, left, movewindow, mon:l
bind = $mod SHIFT CTRL, down, movewindow, mon:d
bind = $mod SHIFT CTRL, up, movewindow, mon:u
bind = $mod SHIFT CTRL, right, movewindow, mon:r
bind = $mod SHIFT CTRL, H, movewindow, mon:l
bind = $mod SHIFT CTRL, J, movewindow, mon:d
bind = $mod SHIFT CTRL, K, movewindow, mon:u
bind = $mod SHIFT CTRL, L, movewindow, mon:r

# === Workspace Navigation ===
bind = $mod, Page_Down, workspace, e+1
bind = $mod, Page_Up, workspace, e-1
bind = $mod, U, workspace, e-1
bind = $mod, I, workspace, e+1
bind = $mod CTRL, down, movetoworkspace, e+1
bind = $mod CTRL, up, movetoworkspace, e-1
bind = $mod CTRL, U, movetoworkspace, e-1
bind = $mod CTRL, I, movetoworkspace, e+1

# === Move Workspaces ===
bind = $mod SHIFT, Page_Down, movetoworkspace, e+1
bind = $mod SHIFT, Page_Up, movetoworkspace, e-1
bind = $mod ALT SHIFT, U, movetoworkspace, e-1
bind = $mod ALT SHIFT, I, movetoworkspace, e+1

# === Mouse Wheel Navigation ===
bind = $mod, mouse_down, workspace, e-1
bind = $mod, mouse_up, workspace, e+1
bind = $mod CTRL, mouse_down, movetoworkspace, e-1
bind = $mod CTRL, mouse_up, movetoworkspace, e+1

# === Numbered Workspaces ===
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, workspace, 5
bind = $mod SHIFT, 2, workspace, 6
bind = $mod SHIFT, 3, workspace, 7
bind = $mod SHIFT, 4, workspace, 8

# === Move to Numbered Workspaces ===
bind = $mod ALT, 1, movetoworkspace, 1
bind = $mod ALT, 2, movetoworkspace, 2
bind = $mod ALT, 3, movetoworkspace, 3
bind = $mod ALT, 4, movetoworkspace, 4
bind = $mod ALT, 5, movetoworkspace, 5
bind = $mod ALT, 6, movetoworkspace, 6
bind = $mod ALT, 7, movetoworkspace, 7
bind = $mod ALT, 8, movetoworkspace, 8
bind = $mod ALT, 9, movetoworkspace, 9
bind = $mod ALT, 0, movetoworkspace, 10

# === Column Management ===
bind = $mod, bracketleft, layoutmsg, preselect l
bind = $mod, bracketright, layoutmsg, preselect r

# === Sizing & Layout ===
bind = $mod SHIFT, R, layoutmsg, togglesplit
bind = $mod CTRL, F, resizeactive, exact 100%

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindmd = $mod, mouse:272, Move window, movewindow
bindmd = $mod, mouse:273, Resize window, resizewindow

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindd = $mod, code:20, Expand window left, resizeactive, -100 0
bindd = $mod, code:21, Shrink window left, resizeactive, 100 0

# === Manual Sizing ===
binde = $mod, minus, resizeactive, -10% 0
binde = $mod, equal, resizeactive, 10% 0
binde = $mod SHIFT, minus, resizeactive, 0 -10%
binde = $mod SHIFT, equal, resizeactive, 0 10%

# === Screenshots ===
bind = , XF86Launch1, exec, grimblast copy area
bind = CTRL, XF86Launch1, exec, grimblast copy screen
bind = ALT, XF86Launch1, exec, grimblast copy active
bind = , Print, exec, grimblast copy area
bind = CTRL, Print, exec, grimblast copy screen
bind = ALT, Print, exec, grimblast copy active

# === System Controls ===
bind = $mod SHIFT, P, dpms, off

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Play/Pause
bindl=, XF86AudioPlay, exec, playerctl play-pause

# Volume 
bindel = $mod ALT, X, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mod ALT, Z, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Play/Pause
bindl=$mod SHIFT, C, exec, playerctl play-pause

# Next track
bindl=, XF86AudioNext, exec, playerctl next

# Past track
bindl=, XF86AudioPrev, exec, playerctl previous

# Next track
bindl=$mod SHIFT, V, exec, playerctl next

# Past track
bindl=$mod SHIFT, X, exec, playerctl previous

# Pypr
bind = $mod SHIFT, N, togglespecialworkspace, minimized   # toggle the "minimized" special workspace visibility
bind = $mod SHIFT, O, exec, pypr shift_monitors +1      # swaps workspaces between monitors
bind = $mod SHIFT, Z, exec, pypr zoom ++0.5             # zooms in the focused workspace
bind = $mod CTRL, Z, exec, pypr zoom --0.5
bind = $mod, Z, exec, pypr zoom                         # toggle zooming


